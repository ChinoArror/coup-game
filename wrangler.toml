name = "coup-shadow-protocol"
main = "worker.ts"
compatibility_date = "2024-02-20"
compatibility_flags = ["expose_global_message_channel"]

[placement]
# Latency hint only; provider egress is handled by api-transfer's US host.
region = "gcp:us-east4"

routes = [
  { pattern = "coup.aryuki.com", custom_domain = true }
]

[assets]
directory = "dist"
not_found_handling = "none"
binding = "ASSETS"
run_worker_first = ["/*", "!/assets/*"]

[vars]
SITE_URL = "https://coup.aryuki.com"
ENVIRONMENT = "production"
SSO_APP_ID = "coup-shadow-protocol"
AI_RELAY_URL = "https://model.aryuki.com"
Model_1 = "gemini-3.8-flash"
Model_2 = "deepseek-flash"
Model_3 = "gpt-6-luna"

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "coup-game-db"
database_id = "53591d43-2dfd-4308-ae04-d8e1999e6ca3"

[[durable_objects.bindings]]
name = "ROOM_GAME"
class_name = "RoomGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomGame"]
